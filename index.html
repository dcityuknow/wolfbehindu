<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lost Island · The Spy Among Us</title>
<!-- Zama Relayer SDK is loaded from the CDN (WASM + WebWorker are hard to bundle) -> window.relayerSDK -->
<script src="https://cdn.zama.org/relayer-sdk-js/0.4.5/relayer-sdk-js.umd.cjs"></script>
</head><body>
<canvas id="c"></canvas><div id="fx"></div>
<div id="hud" style="display:none">
 <div id="top"><div id="role">Role: ?</div><div id="tk">Tasks: 0/3</div><div id="rd">Round 1</div></div>
 <button id="bHelp" class="g">❓ Briefing</button><button id="bView" class="g">📷 3rd person (V)</button><div id="cross"></div><div id="lockhint">🖱 Click the screen to lock the mouse · Left click: shoot · R: reload · G: grenade · 1-4: switch weapon · V: change view</div><div id="toast"></div><div id="prompt"></div>
 <div id="btns"><button id="bKill" class="r" disabled>🔪 Assassinate (Q)</button><button id="bChk" class="g">🏁 Check mission</button></div>
</div>
<div id="menu" class="ov" style="display:flex"><div id="ob"></div></div>
<div id="howto" class="ov"></div>
<div id="splash" class="ov"><h1 id="sp"></h1><p id="sp2"></p></div>
<div id="mini" class="ov"><div class="pn"><div id="mbody"></div><button id="mx" class="g">Close</button></div></div>
<div id="meet" class="ov"><div class="pn"><h2>🚨 <span id="mwhy"></span> <small id="mt"></small></h2><div id="mrow"></div>
 <div id="chat"></div><input id="ci" placeholder="Say something…"><button id="cs" class="g">Send</button><button id="skip">Skip — nobody is ejected</button><div id="mstat"></div></div></div>
<div id="end" class="ov"><h1 id="et"></h1><p id="ed"></p><button onclick="location.reload()">Play again</button></div>
<script type="module" src="/src/main.ts"></script>
</body></html>
